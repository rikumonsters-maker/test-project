name: DaySync Production Verify
on:
  push:
    branches: [main]
  deployment_status:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional exact main commit SHA to verify'
        required: false
        type: string
permissions:
  contents: read
jobs:
  production:
    if: github.event_name != 'deployment_status' || (github.event.deployment.environment == 'Production' && contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    name: day-sync-production-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the requested commit is current main
        run: test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.deployment.sha || github.sha }}
      - run: node scripts/verify-production.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.deployment.sha || github.sha }}
