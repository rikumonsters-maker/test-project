name: DaySync Production Verify
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production:
    name: day-sync-production-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-production.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
