name: DaySync CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: day-sync-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test *.test.mjs
        working-directory: frontend
  backend:
    name: day-sync-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npx wrangler deploy --dry-run --config wrangler.production.jsonc --outdir "$RUNNER_TEMP/daysync-worker-dry-run"
        working-directory: backend
  security:
    name: day-sync-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-pr-safety.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: node --test scripts/*.test.mjs
